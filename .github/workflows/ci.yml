name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arenahub/api db:generate
        env:
          DATABASE_URL: postgresql://arenahub:unused@localhost:5432/arenahub
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify Docker engine for Testcontainers and restart tests
        run: docker info --format '{{.ServerVersion}}'
      - name: Integration and db:check on disposable PostgreSQL
        run: pnpm test:integration
      - run: pnpm build
