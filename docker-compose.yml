services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arenahub
      POSTGRES_PASSWORD: arenahub
      POSTGRES_DB: arenahub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenahub -d arenahub"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  postgres_data:

